<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pendaftaran Anggota Klub Panahan</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header class="header">
    <h1>Pendaftaran Anggota Klub Panahan</h1>
    <p>Registrasi anggota baru klub olahraga panahan</p>
  </header>

  <main class="container">

    <!-- HTML: Tabel Jadwal Latihan (Hari, Sesi, Kategori) -->
    <section class="jadwal">
      <h2>Jadwal Latihan</h2>
      <table>
        <thead>
          <tr>
            <th>Hari</th>
            <th>Sesi</th>
            <th>Kategori</th>
          </tr>
        </thead>
        <tbody id="tabelJadwal">
          <tr>
            <td>Senin</td>
            <td>Pagi</td>
            <td>Pemula</td>
          </tr>
          <tr>
            <td>Rabu</td>
            <td>Sore</td>
            <td>Mahir</td>
          </tr>
          <tr>
            <td>Jumat</td>
            <td>Pagi</td>
            <td>Pemula</td>
          </tr>
        </tbody>
      </table>
      <p class="petunjuk">Klik salah satu baris untuk memilih jadwal latihan</p>
    </section>

    <!-- Form Daftar Anggota (Nama, Umur, Jenis Kelamin) -->
    <section class="pendaftaran">
      <form id="formDaftar" novalidate>
        <h2>Daftar Anggota</h2>

        <label for="nama">Nama</label>
        <input type="text" id="nama" name="nama" placeholder="Raka Pratama">

        <label for="umur">Umur</label>
        <input type="number" id="umur" name="umur" placeholder="17">
        <small class="hint">Minimal 15 tahun</small>

        <label for="jadwal">Jadwal Latihan</label>
        <input type="text" id="jadwal" name="jadwal" placeholder="Belum dipilih (klik pada tabel)" readonly>

        <label for="gender">Jenis Kelamin</label>
        <select id="gender" name="gender">
          <option value="">-- Pilih --</option>
          <option value="Laki-laki">Laki-laki</option>
          <option value="Perempuan">Perempuan</option>
        </select>

        <button type="submit" class="btn-daftar">Daftar</button>
      </form>
    </section>

  </main>

  <script src="script.js"></script>
</body>
</html>
